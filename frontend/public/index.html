    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://sdk.cashfree.com" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.simpldsc.com/#organization",
          "name": "SimpleDSC",

          "url": "https://www.simpldsc.com/",

            "@type": "ImageObject",
            "url": "https://www.simpldsc.com/logo.png",

          },
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "telephone": "+91-7992999947",
              "contactType": "customer service",
              "areaServed": "IN",
              "availableLanguage": ["English", "Hindi", "Odia"],
              "hoursAvailable": {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
                "opens": "10:00",
                "closes": "19:00"
              }
            },
            {
              "@type": "ContactPoint",
              "telephone": "+91-7992777799",
              "contactType": "sales",
              "areaServed": "IN"
            }
          ],
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Mallick Complex, Plot No. A/69, Kharavela Nagar, Unit 3",
            "addressLocality": "Bhubaneswar",
            "addressRegion": "Odisha",
            "postalCode": "751001",
            "addressCountry": "IN"
          }
        },

          "@type": "WebSite",
          "@id": "https://www.simpldsc.com/#website",
          "url": "https://www.simpldsc.com/",
          "name": "SimpleDSC",
          "publisher": {
            "@id": "https://www.simpldsc.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.simpldsc.com/products?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
